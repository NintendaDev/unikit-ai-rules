name: Build Manifest

on:
  push:
    branches: [main]
    paths:
      - '**/*.md'
      - 'scripts/**'
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Build and validate manifest
        run: node scripts/build-manifest.js

      # The `generated` field is a fresh `new Date().toISOString()` on every build
      # (scripts/build-manifest.js), so a plain `git diff` always reports a change.
      # `-I` skips hunks whose changed lines ALL match the pattern — a real content
      # change never hides behind it, because its own lines do not match.
      # Do NOT drop the `-I` flag: without it this check fails on every run.
      - name: Check manifest is up to date
        run: |
          git diff --exit-code -I'"generated":' manifest.json || {
            echo "::error::manifest.json is out of date (the 'generated' timestamp is ignored). Run 'node scripts/build-manifest.js' and commit the result."
            exit 1
          }
